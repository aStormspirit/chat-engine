services:
  app:
    build: .
    # Set by deploy/deploy.sh on the server; locally the image is built from source.
    image: ${APP_IMAGE:-anon-chat-userbot}
    restart: unless-stopped
    env_file: .env
    environment:
      # Must stay in sync with the published container port below.
      API_HOST: 0.0.0.0
      API_PORT: 8000
      SESSIONS_DIR: /app/sessions
      ACCOUNTS_FILE: /app/accounts.json
    ports:
      # Localhost only: public traffic arrives through the Cloudflare tunnel.
      - "127.0.0.1:${HOST_PORT:-8000}:8000"
    volumes:
      - ./sessions:/app/sessions
      - ./accounts.json:/app/accounts.json:ro
    stdin_open: true
    tty: true

  # Enabled with COMPOSE_PROFILES=tunnel; the tunnel routes its hostname to http://app:8000.
  cloudflared:
    image: cloudflare/cloudflared:2026.10.0
    profiles: [tunnel]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      app:
        condition: service_healthy
